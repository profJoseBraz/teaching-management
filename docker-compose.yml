services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-docente-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: gestao
      POSTGRES_DB: gestao_docente
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_docente"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
